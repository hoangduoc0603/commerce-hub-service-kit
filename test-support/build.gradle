plugins {
    // java-library thay vì java: có cấu hình 'api' và 'implementation'. Consumer chỉ thấy phần khai 'api',
    // phần còn lại không lọt vào classpath của họ.
    id 'java-library'
}

java {
    // Biên dịch và chạy test bằng JDK 25 đã cài trên máy; không dùng plugin foojay tự tải JDK
    // (java-library.md, bảng lựa chọn).
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencies {
    // BOM của Boot ở 'api': các dòng api dưới không ghi version, version lấy từ BOM. Khi publish, BOM
    // đi theo artifact (POM có <dependencyManagement> import), nên consumer giải được version.
    // Service cũng nhận đúng BOM này từ convention plugin, hai nguồn cùng 4.1.2 nên không xung đột.
    api platform(libs.spring.boot.dependencies)

    // 'api': service dùng HexagonalRules (field kiểu ArchRule) và @AnalyzeClasses/@ArchTest/ArchTests,
    // nên ArchUnit phải nằm trên classpath compile của service. archunit-junit6 kéo theo engine ArchUnit
    // ở scope runtime, nên JUnit Platform của service tự tìm thấy các field @ArchTest.
    // Version ghim trong catalog vì Spring Boot không quản lý ArchUnit.
    api libs.archunit.junit6

    // @TestConfiguration nằm ở đây. PostgresTestcontainersConfiguration là class public mang annotation
    // này, nên service cần nó lúc compile test.
    api 'org.springframework.boot:spring-boot-test'
    // @ServiceConnection và cơ chế Boot tự khởi động container trước khi tạo DataSource.
    api 'org.springframework.boot:spring-boot-testcontainers'
    // PostgreSQLContainer (Testcontainers 2.0, package org.testcontainers.postgresql).
    api 'org.testcontainers:testcontainers-postgresql'

    // JUnit 6, AssertJ, @SpringBootTest cho test của chính module này.
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // DataSource và JdbcClient để test hỏi được DB. Không đưa vào 'api': service tự chọn JDBC hay JPA.
    testImplementation 'org.springframework.boot:spring-boot-starter-jdbc'
    testRuntimeOnly 'org.postgresql:postgresql'
    // Gradle 9 không tự nạp launcher của JUnit Platform nữa; thiếu dòng này thì task test lỗi ngay khi chạy.
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Fixture 'springindomain' gọi org.springframework.util.Assert: khai rõ thứ code dùng trực tiếp,
    // không dựa vào việc spring-boot-test kéo theo.
    testImplementation 'org.springframework:spring-core'
}

tasks.named('test') {
    // Chạy test trên JUnit Platform (Jupiter). Không có dòng này Gradle không chạy test JUnit 6.
    useJUnitPlatform()
}
