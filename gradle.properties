# groupId cua moi module. Dat o gradle.properties goc de moi project ke thua.
# Thieu thi group la "undefined" va composite build (buoc 8) khong thay duoc phu thuoc theo group:name.
group=io.github.hoangduoc0603.commercehub.kit

# Gradle 9 mac dinh tat configuration cache nhung coi day la che do nen dung.
# Bat ngay tu dau de code build nao khong tuong thich (vi du doc Project luc chay task) bao loi som.
org.gradle.configuration-cache=true

# Version cua moi module khi build tren may. 0.0.0-local khong phai SemVer phat hanh, buoc 7 chan publish
# len GitHub Packages voi version nay; CI truyen version that tu tag (quyet dinh Q2 cua ticket).
version=0.0.0-local
